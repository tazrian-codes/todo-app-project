<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>

  <!-- link css -->
  <link rel="stylesheet" href="style.css">

  <!-- link font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="todo-app">
      <div class="head">
        <img src="src/images/todo-list-svgrepo-com.png">
        <h2 class="headline">Todo App</h2>
      </div>
      <p class="app-tagline">Simple tasks. Clear goals. Real progress.</p>
      <div class="add-task-section">
        <input type="text" id="inputBox" placeholder="Add your task">
        <button id="addBtn">Add</button>
      </div>
      <div class="task-list">
        <div>
          <ul id="listContainer">
            <!-- <li class="checked">Task 1</li>
            <li class="checked">Task 2</li>
            <li class="checked">Task 3</li> -->
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
